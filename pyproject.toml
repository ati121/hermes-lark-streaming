[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lark-streaming"
dynamic = ["version"]
description = "Feishu/Lark CardKit v2.0 streaming cards for Hermes Agent — plugin edition"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aowen-Nowor"},
]
dependencies = [
    "lark-oapi>=1.4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "ruff>=0.1.0",
]

# The plugin code lives at the repo root (alongside plugin.yaml).
# When loaded as a Hermes directory plugin, the plugin loader imports
# __init__.py directly from this directory.
#
# For pip installs the repo root must be the *package* ``hermes_lark_streaming``
# — not a flat set of top-level packages. Listing the packages explicitly (and
# mapping the parent to ".") is what makes the relative imports
# (``from ..config import Config``) resolve in an installed copy, and it also
# pulls in the root-level modules (``runtime_globals``, ``__main__``) that the
# ``find`` directive cannot see because the directory name is not the package
# name. A bare ``find`` used to install ``config``/``state``/``plugin`` as
# top-level packages, shadowing unrelated third-party modules.
[tool.setuptools]
packages = [
    "hermes_lark_streaming",
    "hermes_lark_streaming.aowen",
    "hermes_lark_streaming.cardkit",
    "hermes_lark_streaming.config",
    "hermes_lark_streaming.controller",
    "hermes_lark_streaming.feishu",
    "hermes_lark_streaming.flush",
    "hermes_lark_streaming.patching",
    "hermes_lark_streaming.plugin",
    "hermes_lark_streaming.state",
]

[tool.setuptools.package-dir]
hermes_lark_streaming = "."

[tool.setuptools.package-data]
hermes_lark_streaming = ["plugin.yaml", "feishu/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: no pythonpath needed — conftest.py registers the repo root
# as the hermes_lark_streaming package via importlib.
asyncio_mode = "auto"
# Integration tests require HERMES_SRC_DIR (set by hermes-integration-test.yml).
# Exclude from default `pytest tests/` run to avoid 25 skipped in external sync job.
# Run explicitly: `pytest tests/integration/`
norecursedirs = ["tests/integration"]
filterwarnings = [
    # lark_oapi uses deprecated datetime.utcfromtimestamp (Python 3.12+)
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    # lark_oapi ws client calls asyncio.get_event_loop() at import time
    "ignore:There is no current event loop:DeprecationWarning",
    # v1.1.1: lark_oapi uses deprecated pkg_resources.declare_namespace
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    "ignore:Deprecated call to:DeprecationWarning",
]
